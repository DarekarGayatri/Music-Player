<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music World</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <ul>
            <div class="nav-left">
                <li class="brand"><img src="logo.jpg">Music</li>
                <li>Home</li>
                <li>About</li>
            </div>
            <div class="volume-controls">
                <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
                <input type="range" id="volumeControl" min="0" max="100" value="100">
            </div>
        </ul>
    </nav>
    <div class="container">
        <div class="songList">
            <h1>Best of Music World - No Copyright Sounds</h1>
            <div class="songItemContainer">
                <div class="songItem">
                    <img src="cover1.jpg" alt="0">
                    <span class="songName">Ishq Hai</span>
                    <span class="songlistplay"><span class="timestamp"> 05:12 <i id="0"
                                class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover2.png" alt="1">
                    <span class="songName">Shiddat</span>
                    <span class="songlistplay"><span class="timestamp"> 03:50 <i id="1"
                                class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                </div>

                <div class="songItem">
                    <img src="cover3.png" alt="2">
                    <span class="songName">Humdum</span>
                    <span class="songlistplay"><span class="timestamp"> 05:05 <i id="2"
                                class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover4.png" alt="3">
                    <span class="songName">Ishq</span>
                    <span class="songlistplay"><span class="timestamp"> 03:48 <i id="3"
                                class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover5.jpg" alt="4">
                    <span class="songName">Tere Liye</span>
                    <span class="songlistplay"><span class="timestamp"> 05:36 <i id="4"
                                class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover6.png" alt="5">
                    <span class="songName">Hasi</span>
                    <span class="songlistplay"><span class="timestamp"> 04:33 <i id="5"
                                class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover7.jpg" alt="6">
                    <span class="songName">Suniyaa Suniyaa</span>
                    <span class="songlistplay"><span class="timestamp"> 03:17 <i id="6"
                                class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover8.jpg" alt="7">
                    <span class="songName">Stay</span>
                    <span class="songlistplay"><span class="timestamp"> 03:39 <i id="7"
                                class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover9.jpg" alt="8">
                    <span class="songName">Akhiyaan</span>
                    <span class="songlistplay"><span class="timestamp"> 03:12 <i id="8"
                                class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                </div>
            </div>
        </div>
        <div class="songBanner"></div>
    </div>
    <div class="bottom">
            <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
            <div class="icons">
                <!-- fontawesome icons -->
                <i class="fa-solid fa-3x fa-backward" id="previous"></i>
                <i class="fa-solid fa-2x fa-backward-step" id="skipBackward"></i>
                <i class="fa-regular fa-3x fa-circle-play" id="masterPlay"></i>
                <i class="fa-solid fa-2x fa-forward-step" id="skipForward"></i>
                <i class="fa-solid fa-3x fa-forward" id="next"></i>
                <!-- Remove the duplicate volume controls from here -->
            </div>
            <div class="songInfo">
                <span id="masterSongName">Ishq Hai</span>
            </div>
        </div>
    <script src="script.js"></script>
    <script src="https://kit.fontawesome.com/a87fd51504.js" crossorigin="anonymous"></script>
</body>

</html>
